# ============================================================
#  Configuración de la base de datos PostgreSQL
# ============================================================
# Cambia estos valores según tu instalación local de PostgreSQL.
# El nombre puede llevar guiones: se crea entre comillas dobles.
db.host=localhost
db.port=5432
db.name=event-logistic-db
db.user=postgres
db.password=admin123

# ============================================================
#  Configuración de Hibernate
# ============================================================
# validate = Hibernate NO crea ni modifica tablas; solo comprueba
#            que las entidades coincidan con el esquema de Flyway.
hibernate.hbm2ddl.auto=validate

# Muestra el SQL que ejecuta Hibernate en la consola (útil para aprender).
hibernate.show_sql=true
hibernate.format_sql=true
